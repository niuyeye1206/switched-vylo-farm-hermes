name: farm-cloud-tokens

# Manual trigger only: farms switched.cloud Cloud Tokens through the Cuty route and
# optionally spends the whole balance as VPS runtime.
#
# Panel v2.0 removed the old "Earn with Vylo" button. New automatable route is Cuty
# (1 token/link, 2 links/day) + a daily streak that credits just for opening /tokens.
# Linkvertise (1.5/link, 10/day) is intentionally NOT farmed: its free path needs
# hcaptcha + a subscription wall, which a CI runner cannot pass safely.
#
# cuttty.com's Turnstile rejects datacenter IPs, so a residential exit is required:
#   * secret HOME_VLESS_URL (preferred) or JP_SOCKS_URL -> local sing-box relay on 10900
#   * secret PROXY          -> ready-made socks5:// or http:// proxy URL
on:
  schedule:
    # 每天 23:30 UTC（北京时间 07:30）跑一次
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: "max Cuty links to attempt (panel hard cap is 2/day; extra is ignored)"
        default: "25"
        required: true
      spend:
        description: "spend all tokens as runtime afterwards (默认不换，token 留在余额里)"
        type: boolean
        default: false
      proxy:
        description: "override proxy URL (empty = use PROXY secret or local sing-box)"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: farm-cloud-tokens
  cancel-in-progress: false

jobs:
  farm:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start upstream relay (HOME_VLESS_URL or JP_SOCKS_URL -> local 10900)
        env:
          HOME_VLESS_URL: ${{ secrets.HOME_VLESS_URL }}
          JP_SOCKS_URL: ${{ secrets.JP_SOCKS_URL }}
        run: |
          RELAY_URL="${HOME_VLESS_URL:-$JP_SOCKS_URL}"
          if [ -z "$RELAY_URL" ]; then
            echo "no relay secret - skipping relay"
            exit 0
          fi
          VER=1.14.1
          curl -sSLo sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar xzf sb.tgz
          cp "sing-box-${VER}-linux-amd64/sing-box" ./sing-box
          python scripts/make_relay.py "$RELAY_URL" relay.json
          nohup ./sing-box run -c relay.json > sb.log 2>&1 &
          for i in $(seq 25); do
            ip=$(curl -s -m 6 --socks5-hostname 127.0.0.1:10900 https://api.ipify.org || true)
            if [ -n "$ip" ]; then echo "relay exit ip: $ip"; break; fi
            sleep 3
          done
          tail -3 sb.log || true

      - name: Install playwright
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Farm
        env:
          NOPROFIT_COOKIES: ${{ secrets.NOPROFIT_COOKIES }}
          INPUT_PROXY: ${{ github.event.inputs.proxy }}
          SECRET_PROXY: ${{ secrets.PROXY }}
          COUNT: ${{ github.event.inputs.count }}
        run: |
          set -o pipefail
          export SW_PROXY="${INPUT_PROXY:-${SECRET_PROXY:-socks5://127.0.0.1:10900}}"
          echo "proxy: ${SW_PROXY%%@*}"
          xvfb-run -a -s "-screen 0 1400x1000x24" python3 -u vylo_farm.py --count "$COUNT" 2>&1 | tee farm.log
          grep SUMMARY farm.log || true

      - name: Upload logs on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: farm-debug
          path: |
            farm.log
            sb.log
            /tmp/cuty_fail_*.png
          if-no-files-found: ignore

      - name: Spend tokens as runtime
        # always(): 即使 Farm 失败(面板抽风/连续失败)，也把已有余额换成时长，别让保活断在这。
        # 余额为 0 时 add_runtime.py 自己会安全跳过。
        if: ${{ always() && github.event.inputs.spend == 'true' }}
        env:
          NOPROFIT_COOKIES: ${{ secrets.NOPROFIT_COOKIES }}
          INPUT_PROXY: ${{ github.event.inputs.proxy }}
          SECRET_PROXY: ${{ secrets.PROXY }}
        run: |
          export SW_PROXY="${INPUT_PROXY:-${SECRET_PROXY:-socks5://127.0.0.1:10900}}"
          xvfb-run -a python3 -u add_runtime.py --tokens 0

      - name: Notify Telegram (balance + runtime)
        if: ${{ always() }}
        env:
          NOPROFIT_COOKIES: ${{ secrets.NOPROFIT_COOKIES }}
          INPUT_PROXY: ${{ github.event.inputs.proxy }}
          SECRET_PROXY: ${{ secrets.PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          export SW_PROXY="${INPUT_PROXY:-${SECRET_PROXY:-socks5://127.0.0.1:10900}}"
          STATE=$(xvfb-run -a python3 -u add_runtime.py --dry-run 2>/dev/null | grep -E '^balance=' || echo "balance=? runtime=?")
          BAL=$(echo "$STATE" | grep -oE 'balance=[0-9]+' | cut -d= -f2 || echo "?")
          RT_RAW=$(echo "$STATE" | sed -E 's/.*runtime=Runtime ([0-9a-z ]+) lasts until (.*)/\1|\2/' || echo "?|?")
          DUR=$(echo "$RT_RAW" | cut -d'|' -f1 | sed -E 's/([0-9]+)d/\1天/g; s/([0-9]+)h/\1小时/g; s/([0-9]+)m/\1分钟/g')
          EXP_RAW=$(echo "$RT_RAW" | cut -d'|' -f2)
          EXP=$(date -d "$EXP_RAW" "+%Y-%m-%d %H:%M" 2>/dev/null || echo "$EXP_RAW")
          N=$(grep -oE 'farmed [0-9]+ Cuty link\(s\)' farm.log 2>/dev/null | grep -oE '[0-9]+' || echo "?")
          MSG=$(printf '🇫🇷 Switched 刷币通知\n✅ 刷币完成：%s 条 Cuty\n🪙 余额：%s 币\n⏱ 运行时长：%s，到 %s' "$N" "$BAL" "$DUR" "$EXP")
          curl -s -m 20 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${MSG}" | head -c 200
